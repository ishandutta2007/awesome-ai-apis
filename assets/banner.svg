<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a18" />
      <stop offset="50%" stop-color="#0e122b" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.1" />
      <circle cx="40" cy="40" r="1.5" fill="#818cf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Keyframe Styles for Animation -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes beamScan {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 200px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 950px 220px; }
      .floating-badges { animation: floatSlow 6s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 8, 12; animation: dashMove 4s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="260" cy="180" r="160" fill="#6366f1" />
    <circle class="orb-2" cx="960" cy="220" r="180" fill="#ec4899" />
    <circle cx="600" cy="120" r="130" fill="#06b6d4" opacity="0.2" />
  </g>

  <!-- Network Circuit Lines (Dynamic data conduits) -->
  <g stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path class="data-stream" d="M 50 100 Q 300 40 600 110 T 1150 90" stroke="#38bdf8" />
    <path class="data-stream" d="M 50 340 Q 350 390 700 320 T 1150 350" stroke="#c084fc" />
    <path d="M 120 210 L 220 210 L 280 260" stroke="#6366f1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
    <path d="M 1080 210 L 980 210 L 920 160" stroke="#f472b6" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  </g>

  <!-- Foreground Content: Perfectly centered & high contrast -->
  <g text-anchor="middle" id="brand-content">
    
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 75)">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="-135" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-118" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">CURATED DIRECTORY • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5" filter="url(#subtleGlow)">Awesome AI APIs 🚀</text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="url(#subGrad)" letter-spacing="0.2">
      The definitive index of production-ready AI, LLM, Vision, Audio &amp; Agent APIs
    </text>

    <!-- Category Pills / Feature Chips (Interactive style floating badges) -->
    <g class="floating-badges" transform="translate(600, 290)">
      <!-- Pill 1: LLM & Chat -->
      <g transform="translate(-400, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc">💬 LLMs &amp; Chat</text>
      </g>
      <!-- Pill 2: Vision & Multimodal -->
      <g transform="translate(-200, 0)">
        <rect x="-90" y="-18" width="180" height="36" rx="18" fill="#111827" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">👀 Vision &amp; Multimodal</text>
      </g>
      <!-- Pill 3: Speech & Audio -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#111827" stroke="#c084fc" stroke-width="1.2" opacity="0.95"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#d8b4fe">🎤 Speech &amp; Audio</text>
      </g>
      <!-- Pill 4: Autonomous Agents -->
      <g transform="translate(195, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#111827" stroke="#f472b6" stroke-width="1.2" opacity="0.95"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fbcfe8">🛠️ Agent Rails &amp; x402</text>
      </g>
      <!-- Pill 5: Open-Source -->
      <g transform="translate(390, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#111827" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">🌐 Open-Source</text>
      </g>
    </g>

    <!-- Bottom Metadata Stats Line -->
    <g transform="translate(600, 365)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">
        FREE TIERS • PRODUCTION ENDPOINTS • COMMUNITY MAINTAINED • REST &amp; SDKs
      </text>
    </g>

  </g>
</svg>
